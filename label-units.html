<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pandora — Unit Placer</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', sans-serif; background: #111; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

/* ── Brand header ── */
.brand-bar {
  display: flex; align-items: center; gap: 12px;
  background: #ddfa00; padding: 6px 14px; flex-shrink: 0;
}
.brand-bar img { height: 38px; width: 38px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
.brand-name {
  font-family: 'Segoe UI', sans-serif; font-weight: 900; font-size: 15px;
  letter-spacing: 0.08em; text-transform: uppercase; color: #111; line-height: 1.1;
}
.brand-sub { font-size: 10px; font-weight: 600; color: rgba(0,0,0,0.5); letter-spacing: 0.12em; text-transform: uppercase; }

/* ── Toolbar ── */
.toolbar {
  display: flex; align-items: center; gap: 8px; padding: 7px 12px;
  background: #1e1e1e; border-bottom: 2px solid #333; flex-shrink: 0; flex-wrap: wrap;
}
.toolbar button {
  padding: 5px 11px; border: 1px solid #555; background: #2a2a2a; color: #eee;
  border-radius: 5px; cursor: pointer; font-size: 12px;
}
.toolbar button:hover { background: #3a3a3a; }
.toolbar button.danger { background: #550000; border-color: #cc2222; }
.toolbar button.export { background: #004400; border-color: #00aa00; }
.toolbar button.active { background: #0055cc; border-color: #3399ff; }
.toolbar label { font-size: 12px; color: #aaa; display: flex; align-items: center; gap: 5px; cursor: pointer; user-select: none; }
.toolbar input[type=checkbox] { accent-color: #ddfa00; }
.sep { width: 1px; height: 26px; background: #444; flex-shrink: 0; }
.stats { font-size: 11px; color: #888; margin-left: auto; }

.main { flex: 1; display: flex; overflow: hidden; }

/* ── Sidebar ── */
.sidebar {
  width: 90px; flex-shrink: 0; background: #161616; border-right: 1px solid #2a2a2a;
  display: flex; flex-direction: column; overflow: hidden;
}
.sidebar-search { padding: 6px; flex-shrink: 0; border-bottom: 1px solid #2a2a2a; }
.sidebar-search input {
  width: 100%; padding: 4px 6px; background: #222; border: 1px solid #444;
  color: #eee; border-radius: 4px; font-size: 11px; outline: none;
}
.sidebar-search input:focus { border-color: #ddfa00; }
.unit-list { flex: 1; overflow-y: auto; padding: 4px; display: flex; flex-direction: column; gap: 3px; }
.unit-chip {
  padding: 4px 6px; background: #252525; border: 1px solid #444; border-radius: 4px;
  font-size: 11px; color: #ccc; cursor: grab; text-align: center; user-select: none; transition: background 0.1s;
}
.unit-chip:hover { background: #333; border-color: #ddfa00; color: #ddfa00; }
.unit-chip.dragging { opacity: 0.4; }
.no-units { font-size: 10px; color: #555; text-align: center; padding: 10px 4px; }

/* ── Map ── */
.map-area { flex: 1; overflow: auto; background: #0a0a0a; }
.map-wrapper { position: relative; min-width: 100%; }
.map-wrapper img { display: block; width: 100%; height: auto; user-select: none; pointer-events: none; }
.map-wrapper svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
.map-wrapper svg.drag-over { outline: 2px dashed #ddfa00; }

/* ── Output ── */
#output-area {
  display: none; flex-shrink: 0; background: #0a0a0a; border-top: 2px solid #00aa00;
  padding: 8px 12px; max-height: 160px; overflow-y: auto;
}
#output-area textarea {
  width: 100%; height: 120px; background: #111; color: #0f0; font-family: monospace;
  font-size: 10px; border: 1px solid #333; padding: 5px; resize: none;
}
.hint { font-size: 11px; color: #666; padding: 4px 12px; background: #191919; border-top: 1px solid #2a2a2a; flex-shrink: 0; }
.hint b { color: #ddfa00; }
</style>
</head>
<body>

<!-- Pandora Brand Bar -->
<div class="brand-bar">
  <img src="logo.jpg" alt="Pandora Self Storage logo">
  <div>
    <div class="brand-name">Pandora Self-Storage</div>
    <div class="brand-sub">Unit Map Editor — Pointe-Claire</div>
  </div>
</div>

<div class="toolbar">
  <button onclick="setFloor('1')" id="btn-f1" class="active">Floor 1</button>
  <button onclick="setFloor('2')" id="btn-f2">Floor 2</button>
  <div class="sep"></div>
  <button onclick="undo()">↩ Undo</button>
  <button onclick="clearFloor()" class="danger">🗑 Clear Units</button>
  <div class="sep"></div>
  <label title="Show corridor calibration graph">
    <input type="checkbox" id="showCalib" checked onchange="render()"> Calib. Graph
  </label>
  <label title="Show unit labels">
    <input type="checkbox" id="showUnits" checked onchange="render()"> Units
  </label>
  <div class="sep"></div>
  <button onclick="exportJSON()" class="export">📋 Copy JS</button>
  <span class="stats" id="stats"></span>
</div>

<div class="main">
  <div class="sidebar">
    <div class="sidebar-search">
      <input id="search" type="search" placeholder="Filter…" oninput="renderSidebar()">
    </div>
    <div class="unit-list" id="unit-list"></div>
  </div>

  <div class="map-area" id="mapArea">
    <div class="map-wrapper" id="mapWrapper">
      <img id="floorImg" src="floor1.png" draggable="false">
      <svg id="overlay"></svg>
    </div>
  </div>
</div>

<div class="hint">
  <b>Drag</b> a unit from the left onto the map.
  &nbsp;·&nbsp; <b>Drag</b> a placed node to reposition it.
  &nbsp;·&nbsp; <b>Double-click</b> a placed node to unplace it.
  &nbsp;·&nbsp; <b>Ctrl+Z</b> undo.
  &nbsp;·&nbsp; Toggle <b>Calib. Graph</b> to show/hide corridor nodes from calibrate2.html.
</div>

<div id="output-area">
  <textarea id="outputText" readonly></textarea>
</div>

    '2901','2902','2903','2904','2905','2906','2907','2908','2909','2910',
    '2911','2912','2913','2914','2915','2916','2917','2918','2919','2920',
    '2921','2922','2923','2924','2925','2926','2927','2928','2929','2930',
    '2931','2932','2933','2934','2935','2936','2937','2938','2939','2940',
    '2941','2942','2943','2944','2945','2946',
  ],
};

const FLOOR_IMGS = { '1': 'floor1.png', '2': 'floor2.png' };

let currentFloor = '1';
let state = { '1': {}, '2': {} }; // { unitId: [fx, fy] }
let calibData = { '1': { nodes: [], edges: [] }, '2': { nodes: [], edges: [] } };
let undoStack = [];

// Load unit placements
try {
  const s = localStorage.getItem('pandora_units_v2');
  if (s) state = JSON.parse(s);
} catch(e) {}

// Load calibration graph from calibrate2.html's localStorage key
function loadCalibData() {
  try {
    const s = localStorage.getItem('pandora_calib_v3');
    if (s) calibData = JSON.parse(s);
  } catch(e) {}
}
loadCalibData();

function persist() { try { localStorage.setItem('pandora_units_v2', JSON.stringify(state)); } catch(e) {} }
function pushUndo() { undoStack.push(JSON.stringify(state[currentFloor])); if (undoStack.length > 80) undoStack.shift(); }

function undo() {
  if (!undoStack.length) return;
  state[currentFloor] = JSON.parse(undoStack.pop());
  persist(); render(); renderSidebar();
}

document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); undo(); }
});

function setFloor(f) {
  currentFloor = f;
  undoStack = [];
  document.getElementById('btn-f1').classList.toggle('active', f === '1');
  document.getElementById('btn-f2').classList.toggle('active', f === '2');
  document.getElementById('floorImg').src = FLOOR_IMGS[f];
  document.getElementById('search').value = '';
  loadCalibData();
  render(); renderSidebar();
}

function clearFloor() {
  if (!confirm(`Clear all placed units on Floor ${currentFloor}?`)) return;
  pushUndo();
  state[currentFloor] = {};
  persist(); render(); renderSidebar();
}

// ── Coords ───────────────────────────────────────────────────────
function svgRect() { return document.getElementById('overlay').getBoundingClientRect(); }
function toFrac(e) { const r = svgRect(); return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height]; }

// ── Sidebar ───────────────────────────────────────────────────────
let draggingChipId = null;

function renderSidebar() {
  const placed = new Set(Object.keys(state[currentFloor]));
  const filter = document.getElementById('search').value.toLowerCase();
  const all = FLOOR_UNITS[currentFloor];
  const list = document.getElementById('unit-list');
  list.innerHTML = '';

  const unplaced = all.filter(id => !placed.has(id) && id.toLowerCase().includes(filter));

  if (!unplaced.length) {
    const msg = document.createElement('div');
    msg.className = 'no-units';
    msg.textContent = placed.size === all.length ? 'All placed!' : 'No match';
    list.appendChild(msg);
  } else {
    for (const id of unplaced) {
      const chip = document.createElement('div');
      chip.className = 'unit-chip';
      chip.textContent = id;
      chip.draggable = true;
      chip.dataset.unit = id;
      chip.addEventListener('dragstart', e => {
        draggingChipId = id;
        chip.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', id);
      });
      chip.addEventListener('dragend', () => {
        chip.classList.remove('dragging');
        draggingChipId = null;
      });
      list.appendChild(chip);
    }
  }

  const total = all.length;
  document.getElementById('stats').textContent = `Floor ${currentFloor}: ${placed.size}/${total} placed`;
}

// ── SVG drag-and-drop from sidebar ───────────────────────────────
const svg = document.getElementById('overlay');

svg.addEventListener('dragover', e => {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  svg.classList.add('drag-over');
});
svg.addEventListener('dragleave', () => svg.classList.remove('drag-over'));
svg.addEventListener('drop', e => {
  e.preventDefault();
  svg.classList.remove('drag-over');
  const id = e.dataTransfer.getData('text/plain');
  if (!id) return;
  pushUndo();
  const [fx, fy] = toFrac(e);
  state[currentFloor][id] = [fx, fy];
  persist(); render(); renderSidebar();
});

// ── Drag placed nodes on SVG (pointer events) ────────────────────
let activeNode = null;
let lastClickTime = {};

svg.addEventListener('pointerdown', e => {
  if (draggingChipId) return;
  const [fx, fy] = toFrac(e);
  const hit = hitTest(fx, fy);
  if (!hit) return;

  e.preventDefault();
  svg.setPointerCapture(e.pointerId);
  activeNode = hit;

  const now = Date.now();
  if (lastClickTime[hit] && now - lastClickTime[hit] < 300) {
    pushUndo();
    delete state[currentFloor][hit];
    persist(); render(); renderSidebar();
    activeNode = null;
    return;
  }
  lastClickTime[hit] = now;
});

svg.addEventListener('pointermove', e => {
  if (!activeNode) return;
  const [fx, fy] = toFrac(e);
  state[currentFloor][activeNode] = [fx, fy];
  render();
});

svg.addEventListener('pointerup', () => {
  if (activeNode) { persist(); activeNode = null; }
});

function hitTest(fx, fy) {
  const r = svgRect();
  const px = fx * r.width, py = fy * r.height;
  const THRESH = 12;
  let best = null, bestD = Infinity;
  for (const [id, [ux, uy]] of Object.entries(state[currentFloor])) {
    const d = Math.hypot(ux * r.width - px, uy * r.height - py);
    if (d < THRESH && d < bestD) { bestD = d; best = id; }
  }
  return best;
}

// ── Render ────────────────────────────────────────────────────────
function render() {
  const r = svgRect();
  const W = r.width, H = r.height;
  svg.innerHTML = '';

  const showCalib = document.getElementById('showCalib').checked;
  const showUnits = document.getElementById('showUnits').checked;

  // ── Calibration graph overlay ─────────────────────────────────
  if (showCalib) {
    const cd = calibData[currentFloor] || { nodes: [], edges: [] };
    const { nodes, edges } = cd;

    // Edges
    for (const [a, b] of edges) {
      if (!nodes[a] || !nodes[b]) continue;
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', nodes[a].x * W); line.setAttribute('y1', nodes[a].y * H);
      line.setAttribute('x2', nodes[b].x * W); line.setAttribute('y2', nodes[b].y * H);
      line.setAttribute('stroke', 'rgba(221,250,0,0.5)');
      line.setAttribute('stroke-width', '2');
      line.setAttribute('stroke-dasharray', '4,3');
      line.style.pointerEvents = 'none';
      svg.appendChild(line);
    }

    // Nodes
    for (let i = 0; i < nodes.length; i++) {
      const n = nodes[i];
      const cx = n.x * W, cy = n.y * H;
      const isEntrance = i === 0;

      const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      g.style.pointerEvents = 'none';

      if (isEntrance) {
        const ring = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        ring.setAttribute('cx', cx); ring.setAttribute('cy', cy); ring.setAttribute('r', 9);
        ring.setAttribute('fill', 'rgba(0,200,100,0.25)');
        ring.setAttribute('stroke', '#00cc66'); ring.setAttribute('stroke-width', '1.5');
        g.appendChild(ring);
      }

      const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      dot.setAttribute('cx', cx); dot.setAttribute('cy', cy); dot.setAttribute('r', isEntrance ? 5 : 3.5);
      dot.setAttribute('fill', isEntrance ? '#00ee66' : 'rgba(221,250,0,0.85)');
      dot.setAttribute('stroke', '#000'); dot.setAttribute('stroke-width', '1');
      g.appendChild(dot);

      const lbl = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      lbl.setAttribute('x', cx + 5); lbl.setAttribute('y', cy - 4);
      lbl.setAttribute('font-size', '6'); lbl.setAttribute('font-weight', 'bold');
      lbl.setAttribute('fill', isEntrance ? '#00ee66' : '#ddfa00');
      lbl.setAttribute('stroke', '#000'); lbl.setAttribute('stroke-width', '0.4');
      lbl.setAttribute('paint-order', 'stroke');
      lbl.textContent = isEntrance ? '★' : i;
      g.appendChild(lbl);

      svg.appendChild(g);
    }
  }

  // ── Unit label nodes ──────────────────────────────────────────
  if (showUnits) {
    for (const [id, [fx, fy]] of Object.entries(state[currentFloor])) {
      const cx = fx * W, cy = fy * H;
      const isDragging = id === activeNode;

      const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      g.style.pointerEvents = 'none';

      if (isDragging) {
        const ring = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        ring.setAttribute('cx', cx); ring.setAttribute('cy', cy); ring.setAttribute('r', 10);
        ring.setAttribute('fill', 'none'); ring.setAttribute('stroke', '#ff5500'); ring.setAttribute('stroke-width', '2');
        g.appendChild(ring);
      }

      const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      dot.setAttribute('cx', cx); dot.setAttribute('cy', cy); dot.setAttribute('r', isDragging ? 5 : 3.5);
      dot.setAttribute('fill', isDragging ? '#ff5500' : '#fff');
      dot.setAttribute('stroke', isDragging ? '#ff5500' : '#111'); dot.setAttribute('stroke-width', '1');
      g.appendChild(dot);

      const textW = id.length * 5.2 + 8;
      const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      rect.setAttribute('x', cx - textW/2); rect.setAttribute('y', cy - 16);
      rect.setAttribute('width', textW); rect.setAttribute('height', 13);
      rect.setAttribute('rx', 3);
      rect.setAttribute('fill', isDragging ? 'rgba(80,20,0,0.92)' : 'rgba(0,0,0,0.82)');
      rect.setAttribute('stroke', isDragging ? '#ff5500' : '#ddfa00');
      rect.setAttribute('stroke-width', '1');
      g.appendChild(rect);

      const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      text.setAttribute('x', cx); text.setAttribute('y', cy - 9.5);
      text.setAttribute('text-anchor', 'middle'); text.setAttribute('dominant-baseline', 'central');
      text.setAttribute('font-size', '7'); text.setAttribute('font-weight', 'bold');
      text.setAttribute('fill', isDragging ? '#ff9966' : '#ddfa00');
      text.textContent = id;
      g.appendChild(text);

      svg.appendChild(g);
    }
  }
}

// ── Export ────────────────────────────────────────────────────────
function exportJSON() {
  function fmt(obj) {
    return Object.entries(obj)
      .map(([id, [x,y]]) => `    '${id}': [${x.toFixed(4)}, ${y.toFixed(4)}]`)
      .join(',\n');
  }
  const text =
    `  // ── FLOOR 1 UNITS ──\n  const F1 = {\n${fmt(state['1'])},\n  };\n\n` +
    `  // ── FLOOR 2 UNITS ──\n  const F2 = {\n${fmt(state['2'])},\n  };`;

  const area = document.getElementById('output-area');
  document.getElementById('outputText').value = text;
  area.style.display = 'block';

  navigator.clipboard.writeText(text)
    .then(() => alert('✅ Copied! Replace the F1 and F2 blocks in index.html.'))
    .catch(() => alert('See the box below — copy manually.'));
}

// ── Init ──────────────────────────────────────────────────────────
const floorImg = document.getElementById('floorImg');
floorImg.onload = () => { render(); };
new ResizeObserver(() => render()).observe(document.getElementById('mapWrapper'));
renderSidebar();
render();
</script>
